[project]
name = "disruption-orchestrator"
version = "0.1.0"
description = "Deterministic state-machine orchestrator for airline disruption handling across CRM, reservations, payments and messaging"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Shahabaj Sheikh" }]
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
claude = ["anthropic>=0.40"]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP042", "B023"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
